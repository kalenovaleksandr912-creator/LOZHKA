services:
  postgres:
    image: postgres:16-alpine
    container_name: kamspace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kamspace
      POSTGRES_USER: kamspace
      POSTGRES_PASSWORD: kamspace
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
