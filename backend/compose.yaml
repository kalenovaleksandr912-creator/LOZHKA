services:
  postgres:
    image: postgres:16-alpine
    container_name: lozhka-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lozhka
      POSTGRES_USER: lozhka
      POSTGRES_PASSWORD: lozhka
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
