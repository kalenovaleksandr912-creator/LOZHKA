<!doctype html>
<html lang="ru" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>LOZHKA</title>
    <script>
      (() => {
        try {
          const theme = window.localStorage.getItem("lozhka-theme");
          if (theme === "rose") {
            document.documentElement.dataset.theme = "rose";
          }
        } catch {}
      })();
    </script>
    <link rel="stylesheet" href="./src/styles/main.css?v=18" />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
    <script type="module" src="./src/main.js?v=18"></script>
  </head>
  <body>
    <main class="app-shell" id="app" aria-label="LOZHKA"></main>
  </body>
</html>
